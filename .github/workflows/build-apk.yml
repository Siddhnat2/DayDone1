name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install PySide6 + deploy tool
        run: |
          python -m pip install --upgrade pip
          pip install PySide6
          pip show PySide6 | grep Version
          # extra packages required by pyside6-android-deploy
          REQ=$(python -c "import PySide6,os;print(os.path.join(os.path.dirname(PySide6.__file__),'scripts','requirements-android.txt'))")
          pip install -r "$REQ"

      - name: Download Qt for Python Android wheels (matching version)
        run: |
          VER=$(python -c "import PySide6; print(PySide6.__version__)")
          echo "PySide6 $VER"
          BASE="https://download.qt.io/official_releases/QtForPython"
          mkdir -p wheels
          for P in pyside6 shiboken6; do
            F=$(curl -sL "$BASE/$P/" | grep -o "href=\"[^\"]*${VER}[^\"]*android_aarch64\.whl\"" | head -1 | cut -d'"' -f2)
            echo "$P -> $F"
            if [ -z "$F" ]; then
              echo "ERROR: no aarch64 Android wheel found for $P $VER. Available android files:"
              curl -sL "$BASE/$P/" | grep -o 'href="[^"]*android[^"]*"' | head -30
              exit 1
            fi
            wget -q "$BASE/$P/$F" -O "wheels/$F"
          done
          ls -la wheels

      - name: Compile UI resources
        run: pyside6-rcc --no-compress resources.qrc -o rc_resources.py

      - name: Build APK
        run: |
          set -o pipefail
          PY=$(ls wheels/pyside6-*aarch64.whl | head -1)
          SH=$(ls wheels/shiboken6-*aarch64.whl | head -1)
          # 1) create the deploy config first so we can set our own app icon
          pyside6-android-deploy --name DayDone --wheel-pyside "$PY" --wheel-shiboken "$SH" --force --init || true
          if [ -f pysidedeploy.spec ]; then
            sed -i "s|^icon = .*|icon = $PWD/icon.png|" pysidedeploy.spec
          fi
          # 2) real build via our wrapper (adds sqlite3 + notification permission). `yes` answers the Android SDK licence prompt ("Accept? (y/N)")
          { yes 2>/dev/null || true; } | python tools/android_build.py --name DayDone --wheel-pyside "$PY" --wheel-shiboken "$SH" --force -v 2>&1 | tee build.log

      - name: Collect APK/AAB files
        if: always()
        run: |
          mkdir -p out
          find / \( -name "*.apk" -o -name "*.aab" \) -not -path "/proc/*" -not -path "/sys/*" -not -path "*/android-sdk/*" -not -path "*/sdk/*/platforms/*" 2>/dev/null | tee found.txt
          while read -r f; do cp "$f" out/ || true; done < found.txt
          echo "---- files in out/"; ls -la out
          echo "---- project dir"; ls -la
          echo "---- spec file"; cat pysidedeploy.spec 2>/dev/null | head -60 || true

      - name: Fail if no APK was produced
        run: |
          ls out/*.apk >/dev/null 2>&1 || { echo "No APK produced - see build.log artifact"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DayDone-apk
          path: out/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            found.txt
            pysidedeploy.spec
          if-no-files-found: ignore
