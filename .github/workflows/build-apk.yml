name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Run source and database regression tests
        run: |
          python -m compileall -q main.py db.py notifier.py tools tests
          python -m unittest discover -s tests -v
          test -f qml/imports.qml
          grep -q 'QtQuick.Controls.Basic' qml/imports.qml

      - name: Install PySide6 + deploy tool
        run: |
          python -m pip install --upgrade pip
          # Pin to a Qt-for-Python release with published Android wheels.
          pip install "PySide6==6.8.3"
          python -c "import PySide6; print('PySide6', PySide6.__version__)"
          REQ=$(python -c "import PySide6,os;print(os.path.join(os.path.dirname(PySide6.__file__),'scripts','requirements-android.txt'))")
          test -f "$REQ"
          pip install -r "$REQ"

      - name: Download Qt for Python Android wheels (matching version)
        run: |
          set -euo pipefail
          VER=$(python -c "import PySide6; print(PySide6.__version__)")
          test "$VER" = "6.8.3" || { echo "Unexpected PySide6 version: $VER"; exit 1; }
          echo "PySide6 $VER"
          BASE="https://download.qt.io/official_releases/QtForPython"
          mkdir -p wheels
          for P in pyside6 shiboken6; do
            INDEX="$BASE/$P/$VER/"
            echo "Looking for $P Android wheel at $INDEX"
            PAGE=$(curl --fail --silent --show-error --location "$INDEX")
            F=$(printf '%s' "$PAGE" | grep -oE 'href="[^"]*android_aarch64\.whl"' | cut -d'"' -f2 | grep -i "$VER" | head -1 || true)
            if [ -z "$F" ]; then
              echo "ERROR: no android_aarch64 wheel found for $P $VER in $INDEX"
              printf '%s' "$PAGE" | grep -oE 'href="[^"]*android[^"]*"' | head -30 || true
              exit 1
            fi
            echo "$P -> $F"
            wget --quiet --show-progress "$INDEX$F" -O "wheels/$(basename "$F")"
          done
          ls -lh wheels

      - name: Compile Qt resources
        run: pyside6-rcc --no-compress resources.qrc -o rc_resources.py

      - name: Build APK
        run: |
          set -o pipefail
          PY=$(find wheels -maxdepth 1 -name 'pyside6-*android_aarch64.whl' -print -quit)
          SH=$(find wheels -maxdepth 1 -name 'shiboken6-*android_aarch64.whl' -print -quit)
          test -n "$PY" && test -n "$SH"
          # Initialize deployment config, but do not mask failures in the real build.
          pyside6-android-deploy --name DayDone --wheel-pyside "$PY" --wheel-shiboken "$SH" --force --init
          if [ -f pysidedeploy.spec ]; then
            sed -i "s|^icon = .*|icon = $PWD/icon.png|" pysidedeploy.spec
          fi
          python tools/android_build.py --name DayDone --wheel-pyside "$PY" --wheel-shiboken "$SH" --force -v 2>&1 | tee build.log

      - name: Collect APK files
        if: always()
        run: |
          mkdir -p out
          find "$GITHUB_WORKSPACE" -type f -name '*.apk' -not -path '*/out/*' -print -exec cp '{}' out/ \; 2>/dev/null || true
          echo '---- APK files'; ls -lh out
          echo '---- deployment spec'; cat pysidedeploy.spec 2>/dev/null | head -80 || true

      - name: Fail if no APK was produced
        run: |
          ls out/*.apk >/dev/null 2>&1 || { echo 'No APK produced; inspect build-log artifact.'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: DayDone-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build.log
            pysidedeploy.spec
          if-no-files-found: ignore
